name: CI

# D16 makes the leak canary sacred — "runs in CI forever, never skipped to move faster." Until this
# file existed that was a claim about infrastructure that did not exist: the canary ran only when a
# human remembered to type the command. This is the "forever" half.
#
# Two jobs on purpose. `offline` needs no secrets, so it runs on every push including from a fork,
# and it carries the checks that need no database — typecheck, the unit suite, and the two
# structural guards (live-gate, scoped-tx-guard) that catch a mistake the day it is made rather
# than the day someone seeds two tenants. `live` needs the three connection strings and is where
# the canary actually proves tenant isolation.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # NEVER cancel a master run. The `live` job applies migrations, and 0011 uses
  # `-- migrate:no-transaction` for CREATE INDEX CONCURRENTLY — cancelling that mid-build leaves an
  # INVALID index that `IF NOT EXISTS` then skips forever (HANDOVER correction 3). Feature branches
  # only run `offline`, which is pure compute, so cancelling those is free.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  offline:
    name: typecheck + offline suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The live suites skip here (no DATABASE_* set) and that is correct — CB_REQUIRE_LIVE_TESTS is
      # deliberately NOT set on this job, so skipping is permitted. The `live` job below is where
      # skipping becomes a failure.
      - name: Offline tests
        # SESSION_SECRET is a real repo secret on the `live` job below (signs the OAuth state
        # cookie) but was never set here — invisible until this file's first-ever run on a real
        # runner (the repo had 0 git remotes before this commit). test/session.test.ts's OAuth
        # round-trip only signs and verifies against ITSELF, so any >=32-char string satisfies
        # session.ts's length guard; this is not a credential and needs no repo Settings entry.
        env:
          SESSION_SECRET: offline-ci-placeholder-not-a-real-secret-do-not-reuse-anywhere
        run: bun run test

  live:
    name: live isolation suite (leak canary)
    runs-on: ubuntu-latest
    # MASTER ONLY, and this gate is the whole reason this file was edited before a remote existed.
    #
    # The step below runs `bun run migrate` with DATABASE_ADMIN_URL — owner credentials — against the
    # ONE Supabase project that development, the eval harness and CI all share. With
    # `on: push: branches: ['**']` and a per-ref concurrency group, N branches migrate that database
    # in parallel, unserialized. Combined with checksum immutability (migrate.ts), a WIP migration
    # applied from one branch and then edited bricks every other branch's CI permanently.
    #
    # This was inert only because the repo had zero git remotes, which made `git remote add` — the
    # correct response to "all my work is on one laptop" — the action that armed it.
    #
    # Cost of this gate, stated plainly rather than hidden: the leak canary no longer runs on
    # branches or PRs, only on merge to master. D16 calls the canary sacred, so that is a real
    # reduction, not a free win. The offline job still runs everywhere and still carries
    # live-gate.test.ts and scoped-tx-guard.test.ts, which catch a suite opting out of the canary the
    # day it is written. The actual fix is a SECOND database for CI, at which point restore
    # `branches: ['**']` here; CONTEXT.md §9 already lists "is the shared project safe to keep
    # sharing" as uncovered.
    #
    # workflow_dispatch stays so the canary can be run on demand against any ref.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
    # One shared database means one live run at a time, fleet-wide — NOT per-ref like the workflow
    # default above, or a master push and a manual dispatch could migrate concurrently.
    concurrency:
      group: ${{ github.workflow }}-live-shared-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile

      # Migrate BEFORE doctor. Neither job ran this, so the largest and most lock-hazardous SQL in
      # the repo had no automated apply test at all — 0009 and 0011 could only be proven by a human
      # typing the command. It also makes the failure legible: a drifted CI database otherwise fails
      # as a raw 42P01 out of doctor's index assertions rather than as "you have not migrated".
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          DATABASE_AUTH_URL: ${{ secrets.DATABASE_AUTH_URL }}
          CB_APP_DB_PASSWORD: ${{ secrets.CB_APP_DB_PASSWORD }}
          CB_AUTH_DB_PASSWORD: ${{ secrets.CB_AUTH_DB_PASSWORD }}
        run: bun run migrate

      - name: Verify the security posture
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          DATABASE_AUTH_URL: ${{ secrets.DATABASE_AUTH_URL }}
        run: bun run doctor

      - name: Live suites — a skip here is a FAILURE
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          DATABASE_AUTH_URL: ${{ secrets.DATABASE_AUTH_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # THE flag. Without it a missing connection string makes the entire cross-tenant canary
          # report green having asserted nothing (D43). test/live-gate.test.ts additionally scans
          # the suite files so a suite added later cannot quietly opt out of it.
          CB_REQUIRE_LIVE_TESTS: '1'
          NODE_ENV: test
          DEV_AUTH: '1'
          DEV_LOGIN: '1'
          APP_BASE_URL: http://localhost:3000
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          # test/mcp.test.ts gates on a REAL membership pair rather than seeding its own, so
          # without these the suite would skip — and under CB_REQUIRE_LIVE_TESTS that is a hard
          # failure, by design. `bun run seed:a17` prints a valid pair to use as these secrets.
          CB_MCP_PRINCIPAL: ${{ secrets.CB_MCP_PRINCIPAL }}
          CB_MCP_WORKSPACE: ${{ secrets.CB_MCP_WORKSPACE }}
        run: bun run test
