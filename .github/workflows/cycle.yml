name: Cycle engine

# M8 (docs/pipeline-roadmap.md) — the repo's first scheduled workflow. Runs `bun run cycle` against
# the one shared Supabase project (same project ci.yml's `live` job uses — see
# company-brain-ci-decisions: a separate CI project is a planned, not-yet-done step). Its own
# concurrency group keeps scheduled runs serialized against EACH OTHER without blocking or being
# blocked by ci.yml's `live` job, which uses a differently-named group.
#
# Cadence is hourly for M9 backward-mention discovery. Synchronous ingest keeps ordinary outgoing
# edges fresh; the scheduled full walk is what finds an older page naming a page created later.
#
# M10 wave 1 adds fact_extraction — UNLIKE link_extraction, this is real per-page LLM spend (capped
# at its own $2.00/run budgetUsdDefault, but that is a PER-RUN cap, not a daily one, and this runs
# hourly). cb_internal.cycle_fact_extraction_candidates filters to pages whose content_hash changed
# since their last extraction, so a steady-state hour with no new/edited pages costs near zero — but
# confirm that is still true, and that the cadence/cap are actually wanted, before this reaches
# master. Explicit --phase order (not the registry's alphabetical fallback) so fact_extraction always
# has a place in the sequence a human chose, not one `registeredPhaseNames()`'s sort happened to give.
#
# Never runs `bun run migrate` — assumes the target DB is already migrated, so a scheduled tick
# can't race or interact with ci.yml's migration-serialization concerns.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: cycle-engine-shared-db
  cancel-in-progress: false

jobs:
  run-cycle:
    name: run cycle (link + fact extraction)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile

      - name: Run cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: bun run cycle --phase link_extraction --phase fact_extraction
